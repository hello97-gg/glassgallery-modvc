<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Glass Gallery</title>
  <meta name="robots" content="noindex, follow" />
  <style>
    body {
      background: #181818;
      color: #e5e5e5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      font-size: 3.5rem;
      margin: 0 0 1rem;
      color: #ffffff;
      font-weight: 800;
    }
    p {
      font-size: 1.15rem;
      color: #a0a0a0;
      max-width: 500px;
      margin: 0 0 2rem;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      background: #f5c3b8;
      color: #181818;
      padding: 0.75rem 1.75rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>The page or image you are looking for does not exist, has been removed, or is temporarily unavailable.</p>
  <a href="/">Back to Glass Gallery</a>
</body>
</html>
