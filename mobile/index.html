    <style>
      /* Remove native tap highlight overlay across the mobile app */
      *, *::before, *::after {
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none;
      }
      button, a, [role="button"] {
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
        user-select: none;
      }

      /* Ultra-smooth hardware-accelerated momentum scrolling for mobile devices */
      html, body {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
        min-height: 100%;
        background-color: #0a0a0a;
      }
      
      /* Target all overflow-y scroll panels in the app for momentum scrolling */
      .overflow-y-auto {
        -webkit-overflow-scrolling: touch !important;
      }

      /* Native Instagram/Pinterest-style Instant Modal Transition */
      @keyframes modalEnter {
        0% { opacity: 0; transform: scale(0.97) translateY(8px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-modal-enter {
        animation: modalEnter 180ms cubic-bezier(0.16, 1, 0.3, 1) both;
        will-change: transform, opacity;
      }

      @keyframes detailContentFadeIn {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-detail-content {
        animation: detailContentFadeIn 250ms cubic-bezier(0.2, 0, 0, 1) 150ms both;
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
