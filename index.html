    <style>
      /* Ultra-smooth hardware-accelerated inertia scrolling for mobile devices */
      html, body {
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
      }
      
      /* Target all overflow-y scroll panels in the app for momentum scrolling */
      .overflow-y-auto {
        -webkit-overflow-scrolling: touch !important;
        scroll-behavior: smooth !important;
        overscroll-behavior-y: contain !important;
      }
      
      /* Hardware acceleration only for grid layout elements, NOT images */
      .break-inside-avoid {
        transform: translateZ(0);
        backface-visibility: hidden;
      }
      
      /* Hide scrollbar for elements with hidden-scrollbar class */
      .hidden-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hidden-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>
